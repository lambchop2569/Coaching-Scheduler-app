<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coach Scheduler Activity</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #202225;
        color: #f2f2f2;
        margin: 0;
        padding: 24px;
      }
      .card {
        max-width: 720px;
        margin: 0 auto;
        background: #2f3136;
        border-radius: 12px;
        padding: 24px;
      }
      button {
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        margin-right: 8px;
        margin-top: 8px;
        cursor: pointer;
        background: #5865f2;
        color: white;
      }
      .secondary {
        background: #4f545c;
      }
      .success {
        background: #2f8f4f;
      }
      .danger {
        background: #d83c3c;
      }
      .panel {
        margin-top: 16px;
        padding: 14px;
        background: #36393f;
        border-radius: 8px;
      }
      .coach-item, .appointment-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid #4f545c;
      }
      .coach-summary {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        background: #5865f2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
      }
      .avatar.large {
        width: 56px;
        height: 56px;
      }
      .weekday-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(180px, 1fr));
        gap: 12px;
        margin-top: 16px;
        overflow-x: auto;
        padding-bottom: 12px;
      }
      .weekday-column {
        background: #2f3136;
        border: 1px solid #4f545c;
        border-radius: 12px;
        padding: 12px;
        min-width: 180px;
      }
      .weekday-column h4 {
        margin: 0 0 8px;
        font-size: 0.94rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-bottom: 1px solid #4f545c;
        padding-bottom: 8px;
      }
      .weekday-column button {
        width: 100%;
        margin-right: 0;
        margin-top: 8px;
      }
      .weekday-column .no-slots {
        color: #b9bbbe;
        font-size: 0.92rem;
        min-height: 32px;
      }
      #actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      #actions .confirm-action {
        margin-left: auto;
      }
      .weekday-column button.selected-slot {
        background: #2f8f4f;
      }
      @media (max-width: 900px) {
        .weekday-grid {
          grid-template-columns: repeat(7, minmax(160px, 1fr));
        }
      }
      @media (max-width: 640px) {
        .weekday-grid {
          grid-template-columns: repeat(7, minmax(140px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Coach Scheduler Activity</h1>
      <p id="description">Pick an action to get started.</p>
      <div id="playerNameField" class="panel"></div>
      <div id="actions"></div>
      <div id="details" class="panel"></div>
    </div>

    <script src="/activity-config.js"></script>
    <script type="module" src="./activity.js"></script>
  </body>
</html>
